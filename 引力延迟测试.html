<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>宇宙引力模拟器 - 初始值修正版</title>
  <style>
    body { background: #000; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; }
    #ui { position: fixed; top: 0; left: 0; width: 100%; background: rgba(15, 15, 15, 0.95); padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; border-bottom: 1px solid #333; z-index: 100; }
    .param { display: flex; flex-direction: column; align-items: flex-start; width: 120px; font-size: 11px; }
    input[type=range] { width: 100%; cursor: pointer; }
    #space { position: relative; width: 100vw; height: 100vh; background: #000; cursor: grab; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .obj { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
    #sun { width: 30px; height: 30px; background: radial-gradient(circle, #fff, #ff0, #f60); box-shadow: 0 0 40px #f60; }
    #planet { width: 10px; height: 10px; background: cyan; box-shadow: 0 0 15px cyan; }
    span { color: #0cf; font-weight: bold; font-family: monospace; }
    #status { position: fixed; bottom: 20px; width: 100%; color: #ff4444; font-weight: bold; font-size: 20px; text-shadow: 0 0 10px black; }
  </style>
</head>
<body>

<div id="ui">
  <!-- 注意：这里的 span id 要对应，input 的 value 也要对应 -->
        <label>【引力延迟模拟】1.4r距离衰减  <span>建议用鼠标缩放视图</span></label>
  <div class="param">
    <label>引力 (G): <span id="gVal">...</span></label>
    <input type="range" id="gSlider" min="0" max="1000000" step="500">
  </div>
  <div class="param">
    <label>引力延迟: <span id="dtVal">...</span>ms</label>
    <input type="range" id="dtSlider" min="5" max="2000">
  </div>
  <div class="param">
    <label>运动速度: <span id="vVal">...</span>x</label>
    <input type="range" id="vSlider" min="0.01" max="10.0" step="0.05">
  </div>
  <div class="param">
    <label>轨道寿命: <span id="lifeVal">...</span>秒</label>
    <input type="range" id="lifeSlider" min="1" max="300">
  </div>
  <div class="param">
    <label>视图缩放: <span id="zoomVal">...</span>x</label>
    <input type="range" id="zoomSlider" min="0.01" max="10.0" step="0.01">
  </div>
  <button onclick="resetOrbit()" style="margin-top:10px; padding: 5px 15px; cursor:pointer; height: 30px;">重置</button>
</div>

<div id="space">
  <canvas id="trailCanvas"></canvas>
  <div id="sun" class="obj"></div>
  <div id="planet" class="obj"></div>
</div>

<div id="status"></div>

<script>
  const canvas = document.getElementById('trailCanvas');
  const ctx = canvas.getContext('2d');
  const planetEl = document.getElementById('planet');
  const sunEl = document.getElementById('sun');
  const statusEl = document.getElementById('status');
  const space = document.getElementById('space');

  // --- 1. 这里定义所有的【真实初始值】 ---
  let G = 200000;         // 引力强度
  let dtPhysics = 0.2;    // 0.2s = 200ms
  let vScale = 1.0;       // 速度倍率
  let trailLife = 20000;  // 20秒 = 20000ms
  let zoom = 0.4;        // 缩放倍率
  
  let px = 250, py = 0;   
  let vx = 0, vy = -180;  
  let trailPoints = [];   
  let isCaptured = false; 
  let camX = window.innerWidth / 2;
  let camY = window.innerHeight / 2;
  let timeAccum = 0;
  let lastTime = 0;
  let isDragging = false;
  let lastMouseX, lastMouseY;

  // --- 2. 同步 UI 函数：让滑块和文字 匹配 JS 变量 ---
  function syncUI() {
    // 同步引力
    document.getElementById('gSlider').value = G;
    document.getElementById('gVal').innerText = G;
    
    // 同步延迟 (s -> ms)
    document.getElementById('dtSlider').value = dtPhysics * 1000;
    document.getElementById('dtVal').innerText = Math.round(dtPhysics * 1000);
    
    // 同步速度
    document.getElementById('vSlider').value = vScale;
    document.getElementById('vVal').innerText = vScale.toFixed(2);
    
    // 同步寿命 (ms -> s)
    document.getElementById('lifeSlider').value = trailLife / 1000;
    document.getElementById('lifeVal').innerText = trailLife / 1000;
    
    // 同步缩放
    document.getElementById('zoomSlider').value = zoom;
    document.getElementById('zoomVal').innerText = zoom.toFixed(2);
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    camX = window.innerWidth / 2;
    camY = window.innerHeight / 2;
  }

  function resetOrbit() {
    px = 250; py = 0;
    vx = 0; vy = -180;
    isCaptured = false;
    trailPoints = [];
    statusEl.innerText = "";
  }

  function frame(t) {
    if (!lastTime) lastTime = t;
    let dt = (t - lastTime) / 1000;
    if (dt > 0.05) dt = 0.05;
    lastTime = t;

    if (!isCaptured) {
      px += vx * vScale * dt;
      py += vy * vScale * dt;

      timeAccum += dt;
      if (timeAccum >= dtPhysics) {
        const rSq = px * px + py * py;
        const r = Math.sqrt(rSq);
        if (r < 15) {
          isCaptured = true;
          px = 0; py = 0; vx = 0; vy = 0;
          statusEl.innerText = "CAPTURED BY GRAVITY";
        } else {
          // 物理公式：标准平方反比 r^2
          const force = (G / (rSq + 400)) * timeAccum * 40; 
          vx -= force * (px / r);
          vy -= force * (py / r);
        }
        timeAccum = 0;
      }
      trailPoints.push({ x: px, y: py, t: t });
    }

    while (trailPoints.length > 0 && t - trailPoints[0].t > trailLife) {
      trailPoints.shift();
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    sunEl.style.left = camX + 'px';
    sunEl.style.top = camY + 'px';
    planetEl.style.left = (camX + px * zoom) + 'px';
    planetEl.style.top = (camY + py * zoom) + 'px';

    if (trailPoints.length > 1) {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(0, 255, 255, 0.5)`;
      ctx.lineWidth = Math.max(0.5, 1.2 * zoom);
      const start = trailPoints[0];
      ctx.moveTo(camX + start.x * zoom, camY + start.y * zoom);
      for (let i = 1; i < trailPoints.length; i++) {
        const p = trailPoints[i];
        ctx.lineTo(camX + p.x * zoom, camY + p.y * zoom);
      }
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }

  // --- 交互系统 ---
  space.onmousedown = (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; };
  window.onmousemove = (e) => {
    if (!isDragging) return;
    camX += e.clientX - lastMouseX;
    camY += e.clientY - lastMouseY;
    lastMouseX = e.clientX; lastMouseY = e.clientY;
  };
  window.onmouseup = () => isDragging = false;

  window.onwheel = (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    zoom *= factor;
    zoom = Math.max(0.01, Math.min(zoom, 50));
    document.getElementById('zoomSlider').value = zoom;
    document.getElementById('zoomVal').innerText = zoom.toFixed(2);
  };

  // 滑块改变值
  document.getElementById('gSlider').oninput = function() {
    G = this.value; document.getElementById('gVal').innerText = G;
  };
  document.getElementById('dtSlider').oninput = function() {
    dtPhysics = this.value / 1000; document.getElementById('dtVal').innerText = this.value;
  };
  document.getElementById('vSlider').oninput = function() {
    vScale = parseFloat(this.value); document.getElementById('vVal').innerText = vScale.toFixed(2);
  };
  document.getElementById('zoomSlider').oninput = function() {
    zoom = parseFloat(this.value); document.getElementById('zoomVal').innerText = zoom.toFixed(2);
  };
  document.getElementById('lifeSlider').oninput = function() {
    trailLife = this.value * 1000; document.getElementById('lifeVal').innerText = this.value;
  };

  // --- 启动逻辑 ---
  resize();
  syncUI(); // <--- 关键：在启动时同步滑块状态
  window.onresize = resize;
  requestAnimationFrame(frame);
</script>

</body>
</html>
